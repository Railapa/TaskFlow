<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <div class="menuHamburguer">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="barraPesquisa">
            <input placeholder="Buscar tarefa..." type="text">
        </div>

        <div class="perfilLogin">
            <div style="display: none;" class="loginHeader">
                <h4>Usuário</h4>
                <p>usuario#gmail.com</p>
            </div>
            <div class="iconeLogin">
                <button>U</button>
            </div>
        </div>

        <div class="btnTarefa">
            <button class="openModal"> <i class="fa-solid fa-plus"></i> <span style="display: none;">Nova Tarefa</span></button>
        </div>
    </header>

    <div id="overlay" class="overlay">

    </div>
    <aside id="aside">
        <div class="asideHeader">
            <h2>TaskFlow</h2>
        </div>

        <div class="asideContainer">
            <div class="asideFiltros">
                <div class="filtrosHeader">
                    <h5>Filtros</h5>
                </div>
                <div class="filtrosBtns">
                    <button class="btnFiltros">
                        <i class="fa-regular fa-calendar-check"></i>
                        Todas as tarefas
                    </button>

                    <button class="btnFiltros">
                        <i class="fa-regular fa-calendar"></i>
                        Hoje
                    </button>

                    <button class="btnFiltros">
                        <i class="fa-regular fa-star"></i>
                        Importantes
                    </button>
                </div>
            </div>

            <div class="asideFiltros">
                <div class="filtrosHeader">
                    <h5>Categorias</h5>
                </div>

                <div class="filtrosBtns">
                    <button class="btnFiltros">
                        <i class="fa-solid fa-briefcase"></i>
                        Trabalho
                    </button>

                    <button class="btnFiltros">
                        <i class="fa-solid fa-book"></i>
                        Estudos
                    </button>

                    <button class="btnFiltros">
                        <i class="fa-solid fa-circle-user"></i>
                        Pessoal
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <main id="main">
        <div class="mainHeader">
            <h3>Todas as Tarefas</h3>
            <p><span class="num_tarefas"></span></p>
        </div>

        <div id="cards" class="cards">
            
        </div>
    </main>

    <dialog class="modal" id="modal">
        <div class="modalHeder">
            <h3>Nova Tarefa</h3>
            <button class="closeModal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="modalContent">
            <div class="modalTitle">
                <h4>Título</h4>
                <input placeholder="Digite o título da tarefa..." type="text" name="" id="in_titulo">
            </div>

            <div class="modalDescricao">
                <h4>Descrição</h4>
                <input placeholder="Adicione a descrição da tarefa..." type="text" name="" id="in_descricao">
            </div>

            <div class="modalCategoria">
                <h4>Categoria</h4>
                <select name="" id="in_categoria">
                    <option value="" disabled selected>Selecione a categoria</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Estudo" >Estudo</option>
                    <option value="Pessoal" >Pessoal</option>
                </select>
            </div>

            <div class="modalPrioridade">
                <h4>Prioridade</h4>
                <select name="" id="in_prioridade">
                    <option value="" disabled selected>Selecione a prioridade</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Media">Média</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>

            <div class="modalData">
                <h4>Data</h4>
                <input type="date" name="" id="in_data">
            </div>

            <div class="modalBtns">
                <button class="btnCancelar">Cancelar</button>
                <button class="btnAdd">Criar Tarefa</button>
            </div>
        </div>
    </dialog>
    <script src="./js/script.js"></script>
</body>

</html>
